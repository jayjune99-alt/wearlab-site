<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>문의 게시판 · 웨어랩 인터내셔널</title>
<style>
:root{--bg:#fff;--alt:#f5f5f7;--ink:#1d1d1f;--muted:#6e6e73;--line:#d2d2d7;--soft:#e8e8ed;--link:#0066cc}
@media (prefers-color-scheme:dark){:root{--bg:#000;--alt:#111;--ink:#f5f5f7;--muted:#86868b;--line:#3a3a3c;--soft:#2c2c2e;--link:#2997ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:15px;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding:28px 20px 80px}
h1{font-size:26px;margin:0 0 6px;letter-spacing:-.02em}.muted{color:var(--muted)}
.login{max-width:380px;display:flex;flex-direction:column;gap:10px;margin-top:40px}
input,select,textarea,button{font:inherit}
input,textarea,select{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
button{background:var(--link);color:#fff;border:0;border-radius:980px;padding:12px 22px;cursor:pointer;font-weight:500}
button.ghost{background:transparent;color:var(--link);border:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:20px 0 12px}
.tabs{display:flex;gap:6px}.tabs button{background:var(--alt);color:var(--ink);padding:8px 14px}.tabs button.on{background:var(--ink);color:var(--bg)}
.card{border:1px solid var(--soft);border-radius:16px;padding:18px 20px;margin-bottom:10px;display:grid;grid-template-columns:1fr auto;gap:8px 16px}
.card .t{font-weight:600;font-size:16px}.card .m{font-size:13px;color:var(--muted)}.card .b{white-space:pre-wrap;margin-top:6px}
.card .side{display:flex;flex-direction:column;gap:8px;min-width:170px}
.st{display:inline-block;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--alt)}.st.new{background:#0066cc;color:#fff}.st.replied{background:#0f766e;color:#fff}
textarea.note{min-height:60px;font-size:13px}
.err{color:#c0392b}
@media (max-width:640px){.card{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<h1>문의 게시판</h1><div class="muted">wearlab.kr 으로 들어온 문의. 사장님만 볼 수 있습니다.</div>
<div id="login" class="login">
  <input id="email" type="email" placeholder="이메일" autocomplete="username">
  <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password">
  <button id="go">로그인</button><div id="lerr" class="err"></div>
</div>
<div id="app" style="display:none">
  <div class="bar"><div class="tabs"><button data-f="new" class="on">새 문의</button><button data-f="replied">답변함</button><button data-f="closed">종료</button><button data-f="all">전체</button></div><div><button class="ghost" id="reload">새로고침</button> <button class="ghost" id="logout">로그아웃</button></div></div>
  <div id="list"></div>
</div>
<script>
var URL='https://exbugkgaevbirjonlvlb.supabase.co',KEY='sb_publishable_vg2q-GmYwxVshUeOcji-Dg_gu5h67hk',tok=null,filter='new',rows=[];
try{tok=sessionStorage.getItem('wl_tok');}catch(e){}
var $=function(id){return document.getElementById(id);};
function h(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function hdr(){return {'apikey':KEY,'Authorization':'Bearer '+tok,'Content-Type':'application/json'};}
function show(){ $('login').style.display=tok?'none':'flex'; $('app').style.display=tok?'block':'none'; if(tok) load(); }
$('go').onclick=function(){ $('lerr').textContent='';
  fetch(URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('pw').value})})
  .then(function(r){return r.json();}).then(function(j){ if(!j.access_token) throw new Error(j.error_description||j.msg||'로그인 실패'); tok=j.access_token; try{sessionStorage.setItem('wl_tok',tok);}catch(e){} show(); })
  .catch(function(e){ $('lerr').textContent=e.message; }); };
$('pw').addEventListener('keydown',function(e){ if(e.key==='Enter') $('go').click(); });
$('logout').onclick=function(){ tok=null; try{sessionStorage.removeItem('wl_tok');}catch(e){} show(); };
$('reload').onclick=load;
document.querySelectorAll('.tabs button').forEach(function(b){ b.onclick=function(){ filter=b.dataset.f; document.querySelectorAll('.tabs button').forEach(function(x){x.classList.toggle('on',x===b);}); draw(); }; });
function load(){ $('list').innerHTML='<div class="muted">불러오는 중…</div>';
  fetch(URL+'/rest/v1/inquiries?select=*&order=created_at.desc&limit=300',{headers:hdr()}).then(function(r){ if(r.status===401){ tok=null; try{sessionStorage.removeItem('wl_tok');}catch(e){} show(); throw new Error('다시 로그인'); } return r.json(); })
  .then(function(j){ rows=Array.isArray(j)?j:[]; draw(); }).catch(function(e){ $('list').innerHTML='<div class="err">'+h(e.message)+'</div>'; }); }
function draw(){ var v=rows.filter(function(r){return filter==='all'||r.status===filter;});
  if(!v.length){ $('list').innerHTML='<div class="muted">없습니다.</div>'; return; }
  $('list').innerHTML=v.map(function(r){ var d=new Date(r.created_at); var when=d.toLocaleString('ko-KR',{dateStyle:'medium',timeStyle:'short'});
    return '<div class="card" data-id="'+r.id+'"><div><div class="t">#'+r.id+' '+h(r.company||'')+' · '+h(r.name)+' <span class="st '+h(r.status)+'">'+h(r.status)+'</span></div>'
    +'<div class="m">'+when+' · <a href="'+(/@/.test(r.contact)?'mailto:':'tel:')+h(r.contact)+'">'+h(r.contact)+'</a>'+(r.lang&&r.lang!=='ko'?' · '+h(r.lang):'')+'</div>'
    +'<div class="m">품목 '+h(r.item||'-')+' · 수량 '+h(r.qty||'-')+' · 납기 '+h(r.due||'-')+'</div>'
    +'<div class="b">'+h(r.message||'')+'</div></div>'
    +'<div class="side"><select class="status"><option value="new"'+(r.status==='new'?' selected':'')+'>새 문의</option><option value="replied"'+(r.status==='replied'?' selected':'')+'>답변함</option><option value="closed"'+(r.status==='closed'?' selected':'')+'>종료</option></select>'
    +'<textarea class="note" placeholder="메모">'+h(r.note||'')+'</textarea><button class="save">저장</button></div></div>'; }).join('');
  document.querySelectorAll('.card .save').forEach(function(b){ b.onclick=function(){ var c=b.closest('.card'), id=c.dataset.id; var body={status:c.querySelector('.status').value,note:c.querySelector('.note').value};
    b.disabled=true; fetch(URL+'/rest/v1/inquiries?id=eq.'+id,{method:'PATCH',headers:Object.assign(hdr(),{'Prefer':'return=minimal'}),body:JSON.stringify(body)}).then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); var x=rows.find(function(q){return String(q.id)===String(id);}); if(x){x.status=body.status;x.note=body.note;} b.textContent='저장됨'; setTimeout(function(){b.textContent='저장';b.disabled=false;draw();},700); }).catch(function(e){ b.disabled=false; alert(e.message); }); }; });
}
show();
</script></div></body></html>
